<div class="container">
    <div class="carousel">
        <input *ngFor="let image of sliderImages; let i = index" type="radio" [id]="'carousel-' + (i + 1)"
            name="carousel[]" [checked]="i == currentSlideIndex" (change)="currentSlideIndex = i">

        <ul class="carousel__items">
            <li class="carousel__item" *ngFor="let image of sliderImages">
                <img [src]="image.src" [alt]="image.alt">
            </li>
        </ul>

        <div class="carousel__prev">
            <label *ngFor="let image of sliderImages; let i = index" [for]="'carousel-' + (i + 1)"></label>
        </div>

        <div class="carousel__next">
            <label *ngFor="let image of sliderImages; let i = index" [for]="'carousel-' + (i + 1)"></label>
        </div>

        <div class="carousel__nav">
            <label *ngFor="let image of sliderImages; let i = index" [for]="'carousel-' + (i + 1)"></label>
        </div>

    </div>
</div>
